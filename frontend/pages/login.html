<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOSYT - Iniciar Sesión</title>
    <link rel="stylesheet" href="../styles/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="auth-card">
      <a href="#" class="auth-logo">
        <svg
          class="gosyt-svg"
          viewBox="0 0 100 100"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle cx="28" cy="20" r="4.5" fill="#00A4C4" />
          <path
            d="M68 28C60 20 46 18 36 26C24 35 22 52 30 64C38 76 54 78 66 70C74 64 78 54 78 45H52"
            stroke="#00A4C4"
            stroke-width="11"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="gosyt-text">GOSYT</span>
      </a>

      <div class="auth-header">
        <h1>Bienvenido de nuevo</h1>
        <p>¿No tienes cuenta? <a href="register.html">Solicita una demo</a></p>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label Britt for="email">Correo electrónico corporativo</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="ejemplo@empresa.com"
            required
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember" /> Recordarme
          </label>
          <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </div>

        <div id="passwordError" ></div>

        <button type="submit" id="submit" class="btn-submit">
          Ingresar a la plataforma
        </button>
      </form>
    </div>

    <script src="/frontend/logic/login.js"></script>
  </body>
</html>
